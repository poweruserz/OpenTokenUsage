[package]
name = "opentokenusage"
version = "0.7.10"
description = "OpenTokenUsage - AI subscription usage tracker for Windows"
authors = ["poweruserz"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "opentokenusage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "=2.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3.47", features = ["formatting", "parsing"] }
iana-time-zone = "0.1"
dirs = "6"
log = "0.4"
libc = "0.2"
reqwest = { version = "0.13", features = ["blocking", "socks"] }
rquickjs = { version = "0.12", features = ["bindgen"] }
tauri-plugin-store = "2.4.3"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-log = "2"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-single-instance = "=2.4.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
regex-lite = "0.1.9"
aes-gcm = "0.10.3"
sha2 = "0.11"
rusqlite = { version = "0.40", features = ["bundled"] }
junction = "2.1.0"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.55"
# Already pulled in by tauri; listed so we can read the applied backdrop result.
window-vibrancy = "0.6"
windows-version = "0.1"
windows-sys = { version = "0.59", features = ["Win32_Devices_Display", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_Security_Credentials", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_RemoteDesktop", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }
# Already pulled in by the notification plugin; used to read Do Not Disturb.
windows = { version = "0.62", features = ["UI_Notifications", "Win32_System_Com", "Win32_UI_Accessibility"] }

[dev-dependencies]
serial_test = "3.5.0"
